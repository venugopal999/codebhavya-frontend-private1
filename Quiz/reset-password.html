<script>
/* Capture the recovery link before the auth client removes its URL fragment. */
window.CBQuizRecoveryArrival = (() => {
  const fragment = new URLSearchParams(location.hash.slice(1));
  const query = new URLSearchParams(location.search);
  let hadStoredSession = true;
  try { hadStoredSession = Boolean(sessionStorage.getItem("codebhavya-placement-tab-auth-v1")); }
  catch (_) { /* Require the recovery event if storage cannot be inspected. */ }
  return {
    fromLink: fragment.get("type") === "recovery" || query.get("type") === "recovery" || query.has("code"),
    linkError: fragment.has("error") || query.has("error"),
    hadStoredSession
  };
})();
</script>

<h1>Choose a new password</h1>

<div id="recoveryMessage" role="status" aria-live="polite"><div class="notice">Checking your reset link…</div></div>
<form id="resetForm" hidden>
<label for="newPassword">New password</label>
<input class="input" id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirmPassword">Confirm new password</label>
<input class="input" id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
<div class="actions"><button class="btn gold" id="savePassword" type="submit">Save new password</button></div>
</form>
<p><a href="forgot-password.html">Request another reset link</a> · <a href="signin.html">Back to sign in</a></p>
